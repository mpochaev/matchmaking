server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: matchmaking-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8085/realms/matchmaking}
          audiences: matchmaking-service
      client:
        provider:
          keycloak:
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8085/realms/matchmaking/protocol/openid-connect/token}
        registration:
          rating:
            provider: keycloak
            client-id: ${SERVICE_CLIENT_ID:matchmaking-service-client}
            client-secret: ${SERVICE_CLIENT_SECRET:matchmaking-service-secret}
            authorization-grant-type: client_credentials
  datasource:
    url: ${MATCHMAKING_DB_URL:jdbc:postgresql://localhost:5433/matchmaking}
    username: ${DB_USER:course}
    password: ${DB_PASSWORD:course-dev-only}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  rating:
    base-url: ${RATING_URL:http://localhost:8083}

management:
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    enable:
      spring.security: false
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment.name: local
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  file:
    name: ${LOG_DIR:../runtime-logs}/matchmaking-service.log
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},trace_id=%X{traceId:-},span_id=%X{spanId:-},request_id=%X{requestId:-}] "
