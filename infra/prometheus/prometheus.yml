global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    scrape_protocols: [OpenMetricsText1.0.0, PrometheusText0.0.4]
    static_configs:
      - targets: ["host.docker.internal:9088"]
  - job_name: matchmaking-service
    metrics_path: /actuator/prometheus
    scrape_protocols: [OpenMetricsText1.0.0, PrometheusText0.0.4]
    static_configs:
      - targets: ["host.docker.internal:9080"]
  - job_name: rating-service
    metrics_path: /actuator/prometheus
    scrape_protocols: [OpenMetricsText1.0.0, PrometheusText0.0.4]
    static_configs:
      - targets: ["host.docker.internal:9083"]
