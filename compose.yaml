name: matchmaking-arena-lab01

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-course}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-course-dev-only}
      POSTGRES_DB: matchmaking
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-course} -d matchmaking"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
