server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: rating-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8085/realms/matchmaking}
          audiences: rating-service

management:
  server:
    port: ${MANAGEMENT_PORT:9083}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,2s
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 3s
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  observations:
    enable:
      spring.security: false
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment.name: local
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      file: ecs
  file:
    name: ${LOG_DIR:../runtime-logs}/rating-service.log
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},trace_id=%X{traceId:-},span_id=%X{spanId:-},request_id=%X{requestId:-}] "
